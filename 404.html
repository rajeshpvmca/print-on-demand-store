<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #f8faff;
            font-family: 'Inter', sans-serif;
            background-image: radial-gradient(circle at 100% 100%, rgba(106, 17, 203, 0.05) 0%, transparent 50%), radial-gradient(circle at 0% 0%, rgba(37, 117, 252, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 4rem 2rem;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .error-card:hover {
            transform: translateY(-5px);
        }

        .error-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
        }

        .error-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 0;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 10px 20px rgba(106, 17, 203, 0.15);
        }

        .error-icon {
            font-size: 5rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .btn-group-custom {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 2rem;
        }

        @media (max-width: 576px) {
            .error-card {
                padding: 3rem 1.5rem;
                margin: 1rem;
                border-radius: 20px;
            }
            .error-title {
                font-size: 6rem;
            }
            .btn-group-custom {
                flex-direction: column;
                gap: 10px;
            }
            .btn-group-custom .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="error-card">
            <span class="material-symbols-outlined error-icon">explore_off</span>
            <h1 class="error-title">404</h1>
            <h3 class="fw-bold text-dark mt-3 mb-2" style="font-family: 'Montserrat', sans-serif;">Lost in space?</h3>
            <p class="text-muted lead mb-4" style="font-size: 1.05rem;">We couldn't find the page you were looking for. It might have been moved, deleted, or possibly never existed.</p>
            
            <div class="btn-group-custom">
                <button onclick="history.back()" class="btn btn-secondary-stackly fw-bold px-4 py-3 rounded-pill d-flex justify-content-center align-items-center">
                    <span class="material-symbols-outlined fs-5 me-2">arrow_back</span> Go Back
                </button>
                <a href="index.html" class="btn btn-primary-stackly fw-bold px-4 py-3 rounded-pill d-flex justify-content-center align-items-center">
                    <span class="material-symbols-outlined fs-5 me-2">home</span> Back to Home
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
