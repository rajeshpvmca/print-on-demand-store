<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settlements</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .invoice-card { background: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
    </style>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0">Settlements & Invoices</h2>
        <button class="btn btn-primary-stackly rounded-pill px-4">Download All (.zip)</button>
    </div>

    <div class="invoice-card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th class="text-muted small text-uppercase">Invoice ID</th>
                        <th class="text-muted small text-uppercase">Period</th>
                        <th class="text-muted small text-uppercase">Fulfillment Cost</th>
                        <th class="text-muted small text-uppercase">Status</th>
                        <th class="text-muted small text-uppercase text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="fw-bold">INV-2026-10</td>
                        <td>October 1 - 31, 2026</td>
                        <td class="fw-bold">$12,450.00</td>
                        <td><span class="badge bg-warning text-dark rounded-pill">Pending Payment</span></td>
                        <td class="text-end"><button class="btn btn-sm btn-outline-secondary rounded-pill">View PDF</button></td>
                    </tr>
                    <tr>
                        <td class="fw-bold">INV-2026-09</td>
                        <td>September 1 - 30, 2026</td>
                        <td class="fw-bold">$11,200.00</td>
                        <td><span class="badge bg-success rounded-pill">Paid</span></td>
                        <td class="text-end"><button class="btn btn-sm btn-outline-secondary rounded-pill">View PDF</button></td>
                    </tr>
                    <tr>
                        <td class="fw-bold">INV-2026-08</td>
                        <td>August 1 - 31, 2026</td>
                        <td class="fw-bold">$14,800.00</td>
                        <td><span class="badge bg-success rounded-pill">Paid</span></td>
                        <td class="text-end"><button class="btn btn-sm btn-outline-secondary rounded-pill">View PDF</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
