<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .qc-card { background: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .checklist-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f8f9fa; }
        .product-img { width: 100%; height: 300px; object-fit: cover; border-radius: 12px; }
    </style>
</head>
<body>
    <h2 class="page-title mb-4">Quality Control</h2>
    
    <div class="row g-4">
        <div class="col-md-5">
            <div class="qc-card p-3">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800&h=800&fit=crop" class="product-img mb-3" alt="QC Item">
                <h5 class="fw-bold text-dark">Order #ORD-8942</h5>
                <p class="text-muted small">1x Premium Cotton Tee (Black, Large)</p>
            </div>
        </div>
        <div class="col-md-7">
            <div class="qc-card p-4 h-100">
                <h5 class="fw-bold mb-4 text-dark">Inspection Checklist</h5>
                
                <div class="checklist-item">
                    <input class="form-check-input" type="checkbox" value="" id="c1">
                    <label class="form-check-label flex-grow-1" for="c1">Correct blank product (brand, color, size)</label>
                </div>
                <div class="checklist-item">
                    <input class="form-check-input" type="checkbox" value="" id="c2">
                    <label class="form-check-label flex-grow-1" for="c2">Design matches mockup accurately</label>
                </div>
                <div class="checklist-item">
                    <input class="form-check-input" type="checkbox" value="" id="c3">
                    <label class="form-check-label flex-grow-1" for="c3">Print quality is sharp, no fading or streaks</label>
                </div>
                <div class="checklist-item border-0">
                    <input class="form-check-input" type="checkbox" value="" id="c4">
                    <label class="form-check-label flex-grow-1" for="c4">No physical defects (holes, stains, bad stitching)</label>
                </div>

                <div class="mt-5 d-flex gap-3">
                    <button class="btn btn-success rounded-pill px-4 flex-grow-1 fw-bold">Pass & Ship</button>
                    <button class="btn btn-danger rounded-pill px-4 flex-grow-1 fw-bold">Reject & Reprint</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
