<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Quality Control</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet" />
    <link href="../css/style.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f8f9fa;
            padding: 1.5rem;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .page-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: var(--primary-color);
        }

        .qc-card {
            background: #fff;
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .product-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 12px;
            background: #e9ecef;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #f1f1f1;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 8px;
            padding-left: 10px;
            padding-right: 10px;
        }

        .checklist-item:hover {
            background: rgba(106, 17, 203, 0.02);
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .form-check-input {
            width: 25px;
            height: 25px;
            cursor: pointer;
        }

        .form-check-label {
            cursor: pointer;
            font-weight: 500;
            font-size: 1.05rem;
            color: #333;
        }

        .scan-bar {
            background: #1a1a1a;
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .product-img {
                height: 250px;
            }

            .scan-bar {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            .action-group {
                flex-direction: column;
            }

            .action-group button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <h2 class="page-title mb-0">Quality Control Station</h2>
        <span class="badge bg-danger rounded-pill px-3 py-2 fw-bold">Live Inspection</span>
    </div>
    <div class="scan-bar shadow-sm">
        <div class="d-flex align-items-center gap-3">
            <span class="material-symbols-outlined fs-2">barcode_scanner</span>
            <div class="text-start">
                <span class="d-block small text-uppercase text-secondary fw-bold">Current Order</span>
                <span class="fs-5 fw-bold font-monospace">#ORD-8942</span>
            </div>
        </div>
        <button class="btn btn-outline-light rounded-pill px-4" onclick="window.top.location.href='../404.html'">Scan
            Next Item</button>
    </div>
    <div class="row g-3 g-md-4 align-items-stretch">
        <div class="col-12 col-lg-5">
            <div class="qc-card p-4">
                <img alt="QC Item" class="product-img mb-4" src="../assets/images/img_29.webp" />
                <h5 class="fw-bold text-dark mb-3 border-bottom pb-2">Order Specs</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Product</span>
                    <span class="fw-bold">Premium Cotton Tee</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Color</span>
                    <span class="fw-bold">Black</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Size</span>
                    <span class="fw-bold">Large (L)</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Print File</span>
                    <a href="../404.html" onclick="window.top.location.href='../404.html'"
                        style="color: var(--primary-color); font-weight: 600;">design_8942.png</a>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-7">
            <div class="qc-card p-4">
                <h4 class="fw-bold mb-4 text-dark">Visual Inspection Checklist</h4>
                <div class="checklist-item">
                    <input class="form-check-input border-secondary shadow-none" id="c1" type="checkbox" value="" />
                    <label class="form-check-label flex-grow-1" for="c1">Correct blank product (brand, color,
                        size)</label>
                </div>
                <div class="checklist-item">
                    <input class="form-check-input border-secondary shadow-none" id="c2" type="checkbox" value="" />
                    <label class="form-check-label flex-grow-1" for="c2">Design matches mockup location and
                        scale</label>
                </div>
                <div class="checklist-item">
                    <input class="form-check-input border-secondary shadow-none" id="c3" type="checkbox" value="" />
                    <label class="form-check-label flex-grow-1" for="c3">Print quality is sharp, no fading or
                        streaks</label>
                </div>
                <div class="checklist-item border-0">
                    <input class="form-check-input border-secondary shadow-none" id="c4" type="checkbox" value="" />
                    <label class="form-check-label flex-grow-1" for="c4">No physical defects (holes, stains, bad
                        stitching)</label>
                </div>
                <div class="mt-auto pt-5 d-flex gap-3 action-group">
                    <button class="btn btn-danger rounded-pill px-4 flex-grow-1 py-3 fw-bold fs-5 shadow-sm"
                        onclick="window.top.location.href='../404.html'">Reject &amp; Reprint</button>
                    <button class="btn btn-success rounded-pill px-4 flex-grow-1 py-3 fw-bold fs-5 shadow-sm text-white"
                        onclick="window.top.location.href='../404.html'">Pass &amp; Ship</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
