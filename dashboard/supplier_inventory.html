<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .inventory-card { background: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .stock-level { height: 6px; border-radius: 6px; background: #e9ecef; overflow: hidden; margin-top: 5px; }
        .stock-fill-high { height: 100%; background: #198754; width: 80%; }
        .stock-fill-med { height: 100%; background: #ffc107; width: 40%; }
        .stock-fill-low { height: 100%; background: #dc3545; width: 10%; }
    </style>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0">Inventory Stock Levels</h2>
        <button class="btn btn-outline-secondary rounded-pill px-4">Export CSV</button>
    </div>

    <div class="inventory-card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th class="text-muted small text-uppercase">Blank Product</th>
                        <th class="text-muted small text-uppercase">SKU</th>
                        <th class="text-muted small text-uppercase">Color / Size</th>
                        <th class="text-muted small text-uppercase">Stock Level</th>
                        <th class="text-muted small text-uppercase text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="fw-bold">Premium Cotton Tee</td>
                        <td class="font-monospace text-muted small">TEE-BLK-L</td>
                        <td>Black / Large</td>
                        <td>
                            <span class="small fw-bold">1,204 Units</span>
                            <div class="stock-level"><div class="stock-fill-high"></div></div>
                        </td>
                        <td class="text-end"><button class="btn btn-sm btn-light border rounded-pill">Order Restock</button></td>
                    </tr>
                    <tr>
                        <td class="fw-bold">Classic Hoodie</td>
                        <td class="font-monospace text-muted small">HD-GRY-M</td>
                        <td>Grey / Medium</td>
                        <td>
                            <span class="small fw-bold">420 Units</span>
                            <div class="stock-level"><div class="stock-fill-med"></div></div>
                        </td>
                        <td class="text-end"><button class="btn btn-sm btn-light border rounded-pill">Order Restock</button></td>
                    </tr>
                    <tr>
                        <td class="fw-bold">Ceramic Mug (11oz)</td>
                        <td class="font-monospace text-muted small">MUG-WHT-11</td>
                        <td>White / 11oz</td>
                        <td>
                            <span class="small fw-bold text-danger">45 Units (Low)</span>
                            <div class="stock-level"><div class="stock-fill-low"></div></div>
                        </td>
                        <td class="text-end"><button class="btn btn-sm btn-primary-stackly rounded-pill px-3">Restock Now</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
