<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Storefront</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 1.5rem; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        
        .storefront-header { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 2rem; }
        .cover-photo { width: 100%; height: 280px; object-fit: cover; background: #e9ecef; }
        
        .profile-section { padding: 0 2rem 2rem 2rem; position: relative; display: flex; align-items: flex-end; flex-wrap: wrap; gap: 20px; margin-top: -60px; }
        .profile-pic { width: 130px; height: 130px; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); object-fit: cover; background: #fff; z-index: 2; }
        .profile-info { padding-top: 70px; flex-grow: 1; }
        
        .stat-divider { width: 1px; height: 40px; background: #dee2e6; margin: 0 20px; }
        
        .product-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.04); transition: transform 0.3s ease; height: 100%; display: flex; flex-direction: column; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(106, 17, 203, 0.1); }
        .product-img { height: 180px; object-fit: cover; width: 100%; border-bottom: 1px solid #f1f1f1; }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .cover-photo { height: 180px; }
            .profile-section { flex-direction: column; align-items: center; text-align: center; margin-top: -65px; padding: 0 1rem 1.5rem 1rem; }
            .profile-info { padding-top: 10px; }
            .stat-divider { height: 1px; width: 40px; margin: 10px auto; }
            .profile-stats { flex-direction: column; align-items: center; gap: 10px; }
            .product-img { height: 150px; }
        }
    </style>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="page-title mb-0">My Storefront</h2>
        <div class="d-flex gap-2 w-sm-100">
            <button class="btn btn-outline-secondary rounded-pill px-4 flex-grow-1"><span class="material-symbols-outlined fs-6 align-middle">visibility</span> Preview</button>
            <button class="btn btn-primary-stackly rounded-pill px-4 flex-grow-1"><span class="material-symbols-outlined fs-6 align-middle">edit</span> Edit Profile</button>
        </div>
    </div>

    <!-- Storefront Header -->
    <div class="storefront-header">
        <img src="../assets/images/img_60.webp" class="cover-photo" alt="Cover">
        
        <div class="profile-section">
            <img src="../assets/images/img_37.webp" class="profile-pic" alt="Profile">
            
            <div class="profile-info">
                <h3 class="fw-bold mb-1 text-dark">StudioStack Custom Apparel</h3>
                <p class="text-muted mb-2">Creating premium, minimalist designs for everyday wear.</p>
                <a href="#" class="small fw-bold text-decoration-none" style="color: var(--primary-color);">stackly.com/store/studiostack</a>
            </div>
            
            <div class="d-flex align-items-center profile-stats mt-3 mt-lg-0">
                <div class="text-center">
                    <h4 class="fw-bold mb-0 text-dark">12.5k</h4>
                    <span class="small text-muted text-uppercase">Followers</span>
                </div>
                <div class="stat-divider"></div>
                <div class="text-center">
                    <h4 class="fw-bold mb-0 text-dark">342</h4>
                    <span class="small text-muted text-uppercase">Sales</span>
                </div>
                <div class="stat-divider"></div>
                <div class="text-center">
                    <h4 class="fw-bold mb-0 text-dark">3</h4>
                    <span class="small text-muted text-uppercase">Products</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Live Products -->
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <h5 class="fw-bold mb-0 text-dark">Live Products</h5>
        <button class="btn btn-sm btn-outline-primary rounded-pill"><span class="material-symbols-outlined fs-6 align-middle">add</span> Add New</button>
    </div>
    
    <div class="row g-3 g-md-4 mb-5">
        <div class="col-6 col-md-4 col-xl-3">
            <div class="product-card">
                <img src="../assets/images/img_25.webp" class="product-img" alt="Tee">
                <div class="p-3 d-flex flex-column flex-grow-1">
                    <h6 class="fw-bold mb-1 text-truncate">Minimalist Logo Tee</h6>
                    <div class="mt-auto d-flex justify-content-between align-items-center flex-wrap gap-2 pt-2">
                        <span class="fw-bold" style="color: var(--primary-color);">$24.99</span>
                        <span class="badge bg-success rounded-pill px-3">Live</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl-3">
            <div class="product-card">
                <img src="../assets/images/img_18.webp" class="product-img" alt="Mug">
                <div class="p-3 d-flex flex-column flex-grow-1">
                    <h6 class="fw-bold mb-1 text-truncate">Morning Coffee Mug</h6>
                    <div class="mt-auto d-flex justify-content-between align-items-center flex-wrap gap-2 pt-2">
                        <span class="fw-bold" style="color: var(--primary-color);">$14.99</span>
                        <span class="badge bg-success rounded-pill px-3">Live</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-4 col-xl-3">
            <div class="product-card">
                <img src="../assets/images/img_63.webp" class="product-img" alt="Hoodie">
                <div class="p-3 d-flex flex-column flex-grow-1">
                    <h6 class="fw-bold mb-1 text-truncate">Urban Print Hoodie</h6>
                    <div class="mt-auto d-flex justify-content-between align-items-center flex-wrap gap-2 pt-2">
                        <span class="fw-bold" style="color: var(--primary-color);">$39.99</span>
                        <span class="badge bg-success rounded-pill px-3">Live</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
