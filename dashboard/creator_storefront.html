<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Storefront</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .cover-photo { width: 100%; height: 250px; border-radius: 16px; object-fit: cover; margin-bottom: -50px; background: #e9ecef; }
        .profile-pic { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.1); object-fit: cover; }
        .product-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s ease; }
        .product-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0">My Storefront</h2>
        <button class="btn btn-outline-secondary rounded-pill px-4"><span class="material-symbols-outlined fs-6 align-middle">edit</span> Edit Appearance</button>
    </div>

    <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1200&h=400&fit=crop" class="cover-photo shadow-sm" alt="Cover">
    
    <div class="px-4 mb-5 position-relative">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&h=200&fit=crop" class="profile-pic" alt="Profile">
        <h4 class="fw-bold mt-3 text-dark">StudioStack Custom Apparel</h4>
        <p class="text-muted">Creating premium, minimalist designs for everyday wear.</p>
        <a href="#" style="color: var(--primary-color); font-weight: 600;">stackly.com/store/studiostack</a>
    </div>

    <h5 class="fw-bold mb-4 text-dark border-bottom pb-2">Live Products (3)</h5>
    <div class="row g-4">
        <div class="col-md-4 col-lg-3">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&h=300&fit=crop" class="w-100" style="height: 180px; object-fit: cover;" alt="Tee">
                <div class="p-3">
                    <h6 class="fw-bold mb-1">Minimalist Logo Tee</h6>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fw-bold" style="color: var(--primary-color);">$24.99</span>
                        <span class="badge bg-success rounded-pill">Live</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 col-lg-3">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=400&h=300&fit=crop" class="w-100" style="height: 180px; object-fit: cover;" alt="Mug">
                <div class="p-3">
                    <h6 class="fw-bold mb-1">Morning Coffee Mug</h6>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="fw-bold" style="color: var(--primary-color);">$14.99</span>
                        <span class="badge bg-success rounded-pill">Live</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
