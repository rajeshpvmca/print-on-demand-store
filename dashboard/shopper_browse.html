<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .product-card { border: none; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.3s ease; background: #fff; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 12px 25px rgba(106, 17, 203, 0.15); }
        .product-img { height: 200px; object-fit: cover; width: 100%; background: #e9ecef; }
        .search-bar { border-radius: 50px; padding: 0.8rem 1.5rem; border: 1px solid var(--outline-variant); }
    </style>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0">Browse Products</h2>
        <div class="position-relative w-25">
            <input type="text" class="form-control search-bar shadow-none" placeholder="Search designs...">
            <span class="material-symbols-outlined position-absolute" style="right: 15px; top: 12px; color: #6c757d;">search</span>
        </div>
    </div>

    <div class="row g-4">
        <!-- Product 1 -->
        <div class="col-md-4 col-lg-3">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&h=300&fit=crop" class="product-img" alt="T-Shirt">
                <div class="p-3">
                    <h5 class="fw-bold mb-1 text-dark">Premium Cotton Tee</h5>
                    <p class="text-muted small mb-2">By StudioStack</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold" style="color: var(--primary-color);">$24.99</span>
                        <button class="btn btn-sm btn-primary-stackly rounded-pill px-3">Customize</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Product 2 -->
        <div class="col-md-4 col-lg-3">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?w=400&h=300&fit=crop" class="product-img" alt="Mug">
                <div class="p-3">
                    <h5 class="fw-bold mb-1 text-dark">Ceramic Coffee Mug</h5>
                    <p class="text-muted small mb-2">By ArtisanDesigns</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold" style="color: var(--primary-color);">$14.99</span>
                        <button class="btn btn-sm btn-primary-stackly rounded-pill px-3">Customize</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Product 3 -->
        <div class="col-md-4 col-lg-3">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1581655353564-df123a1eb820?w=400&h=300&fit=crop" class="product-img" alt="Hoodie">
                <div class="p-3">
                    <h5 class="fw-bold mb-1 text-dark">Classic Hoodie</h5>
                    <p class="text-muted small mb-2">By UrbanPrint</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold" style="color: var(--primary-color);">$39.99</span>
                        <button class="btn btn-sm btn-primary-stackly rounded-pill px-3">Customize</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- Product 4 -->
        <div class="col-md-4 col-lg-3">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1620012253972-7b0036137fec?w=400&h=300&fit=crop" class="product-img" alt="Tote Bag">
                <div class="p-3">
                    <h5 class="fw-bold mb-1 text-dark">Eco Tote Bag</h5>
                    <p class="text-muted small mb-2">By GreenVibes</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold" style="color: var(--primary-color);">$19.99</span>
                        <button class="btn btn-sm btn-primary-stackly rounded-pill px-3">Customize</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
