<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .studio-canvas { background: #fff; border-radius: 16px; border: 2px dashed var(--outline-variant); height: 500px; display: flex; align-items: center; justify-content: center; position: relative; }
        .controls-panel { background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.02); height: 100%; }
        .mockup-img { height: 100%; width: 100%; object-fit: contain; padding: 20px; opacity: 0.8; }
        .upload-overlay { position: absolute; display: flex; flex-direction: column; align-items: center; color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0">Product Studio</h2>
        <button class="btn btn-primary-stackly rounded-pill px-4">Publish Product</button>
    </div>

    <div class="row g-4">
        <div class="col-md-8">
            <div class="studio-canvas shadow-sm">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800&h=800&fit=crop" class="mockup-img" alt="Blank Tee">
                <div class="upload-overlay">
                    <span class="material-symbols-outlined fs-1 mb-2">cloud_upload</span>
                    <span class="fw-bold">Drag & Drop Design Here</span>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="controls-panel">
                <h5 class="fw-bold mb-4 text-dark">Settings</h5>
                
                <label class="form-label text-muted small text-uppercase fw-bold">Select Product</label>
                <select class="form-select mb-4 shadow-none border-1 border-secondary">
                    <option>Premium Cotton Tee</option>
                    <option>Classic Hoodie</option>
                    <option>Ceramic Mug</option>
                </select>

                <label class="form-label text-muted small text-uppercase fw-bold">Color Options</label>
                <div class="d-flex gap-2 mb-4">
                    <div style="width: 30px; height: 30px; background: #000; border-radius: 50%; cursor: pointer;"></div>
                    <div style="width: 30px; height: 30px; background: #fff; border: 1px solid #ccc; border-radius: 50%; cursor: pointer;"></div>
                    <div style="width: 30px; height: 30px; background: #dc3545; border-radius: 50%; cursor: pointer;"></div>
                    <div style="width: 30px; height: 30px; background: #0d6efd; border-radius: 50%; cursor: pointer;"></div>
                </div>

                <label class="form-label text-muted small text-uppercase fw-bold">Price Markup</label>
                <div class="input-group mb-4">
                    <span class="input-group-text bg-light">$</span>
                    <input type="text" class="form-control shadow-none border-light-subtle" value="24.99">
                </div>
                
                <p class="text-success small fw-bold mt-2">Estimated Profit: $7.50 / item</p>
            </div>
        </div>
    </div>
</body>
</html>
