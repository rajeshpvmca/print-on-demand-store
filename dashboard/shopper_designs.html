<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Designs</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .design-card { background: #fff; border-radius: 16px; border: 2px dashed #dee2e6; display: flex; align-items: center; justify-content: center; flex-direction: column; height: 250px; cursor: pointer; transition: all 0.3s ease; }
        .design-card:hover { border-color: var(--primary-color); background: rgba(106, 17, 203, 0.02); }
        .design-item { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <h2 class="page-title mb-4">My Saved Designs</h2>
    <div class="row g-4">
        <!-- New Design -->
        <div class="col-md-4 col-lg-3">
            <div class="design-card text-muted">
                <span class="material-symbols-outlined fs-1 mb-2">add_circle</span>
                <span class="fw-bold">Create New Design</span>
            </div>
        </div>
        <!-- Existing Design -->
        <div class="col-md-4 col-lg-3">
            <div class="design-item position-relative">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400&h=300&fit=crop" class="w-100" style="height: 180px; object-fit: cover;" alt="Design">
                <div class="p-3">
                    <h6 class="fw-bold mb-1">Company Logo Tee</h6>
                    <p class="text-muted small mb-2">Last edited: 2 days ago</p>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-secondary w-50 rounded-pill"><span class="material-symbols-outlined fs-6 align-middle">edit</span> Edit</button>
                        <button class="btn btn-sm btn-primary-stackly w-50 rounded-pill">Order</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
