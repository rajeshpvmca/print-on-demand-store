<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .stat-card { background: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 1.5rem; }
        .chart-container { background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <h2 class="page-title mb-4">Sales & Analytics</h2>
    
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="stat-card">
                <p class="text-muted small text-uppercase fw-bold mb-1">Total Revenue</p>
                <h3 class="fw-bold mb-0" style="color: var(--primary-color);">$8,459.00</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <p class="text-muted small text-uppercase fw-bold mb-1">Items Sold</p>
                <h3 class="fw-bold mb-0 text-dark">342</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <p class="text-muted small text-uppercase fw-bold mb-1">Store Views</p>
                <h3 class="fw-bold mb-0 text-dark">12.5K</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <p class="text-muted small text-uppercase fw-bold mb-1">Conversion Rate</p>
                <h3 class="fw-bold mb-0 text-success">2.7%</h3>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-8">
            <div class="chart-container">
                <h5 class="fw-bold mb-4 text-dark">Revenue Overview</h5>
                <div id="revenueChart"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="chart-container h-100">
                <h5 class="fw-bold mb-4 text-dark">Top Selling Products</h5>
                <div id="productChart"></div>
            </div>
        </div>
    </div>

    <script>
        var revOptions = {
            series: [{
                name: 'Revenue',
                data: [400, 650, 500, 900, 1200, 1050, 1600, 1400, 1900]
            }],
            chart: { type: 'bar', height: 350, toolbar: { show: false }, fontFamily: 'Inter, sans-serif' },
            colors: ['#c18a39'],
            plotOptions: { bar: { borderRadius: 4, columnWidth: '40%' } },
            dataLabels: { enabled: false },
            xaxis: { categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'] },
            theme: { mode: 'light' }
        };

        var revChart = new ApexCharts(document.querySelector("#revenueChart"), revOptions);
        revChart.render();

        var prodOptions = {
            series: [44, 55, 13, 33],
            chart: { type: 'donut', height: 350, fontFamily: 'Inter, sans-serif' },
            labels: ['Classic Tee', 'Mug', 'Hoodie', 'Tote Bag'],
            colors: ['#6a11cb', '#2575fc', '#dfb162', '#198754'],
            theme: { mode: 'light' },
            legend: { position: 'bottom' }
        };

        var prodChart = new ApexCharts(document.querySelector("#productChart"), prodOptions);
        prodChart.render();
    </script>
</body>
</html>
