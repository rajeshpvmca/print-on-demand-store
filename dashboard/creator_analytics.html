<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales & Analytics</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body { background-color: #f8f9fa; padding: 1.5rem; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        
        .stat-card { background: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.03); padding: 1.5rem; position: relative; overflow: hidden; }
        .stat-card::after { content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100%; background: linear-gradient(90deg, transparent, rgba(106, 17, 203, 0.03)); }
        
        .trend-up { color: #198754; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; background: rgba(25,135,84,0.1); padding: 2px 8px; border-radius: 50px; }
        .trend-down { color: #dc3545; font-size: 0.85rem; font-weight: 600; display: inline-flex; align-items: center; background: rgba(220,53,69,0.1); padding: 2px 8px; border-radius: 50px; }
        
        .chart-container { background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.03); height: 100%; }

        @media (max-width: 576px) {
            body { padding: 1rem; }
            .stat-card { padding: 1.2rem; }
            .chart-container { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h2 class="page-title mb-0">Sales & Analytics</h2>
        <select class="form-select w-auto shadow-none rounded-pill" style="font-size: 0.9rem;">
            <option>Last 30 Days</option>
            <option>This Year</option>
            <option>All Time</option>
        </select>
    </div>
    
    <div class="row g-3 g-md-4 mb-4">
        <div class="col-6 col-lg-3">
            <div class="stat-card">
                <p class="text-muted small text-uppercase fw-bold mb-2">Revenue</p>
                <h3 class="fw-bold mb-2" style="color: var(--primary-color);">$8,459.00</h3>
                <div class="trend-up"><span class="material-symbols-outlined fs-6">trending_up</span> +12.5%</div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="stat-card">
                <p class="text-muted small text-uppercase fw-bold mb-2">Items Sold</p>
                <h3 class="fw-bold mb-2 text-dark">342</h3>
                <div class="trend-up"><span class="material-symbols-outlined fs-6">trending_up</span> +8.2%</div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="stat-card">
                <p class="text-muted small text-uppercase fw-bold mb-2">Store Views</p>
                <h3 class="fw-bold mb-2 text-dark">12.5K</h3>
                <div class="trend-down"><span class="material-symbols-outlined fs-6">trending_down</span> -2.1%</div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="stat-card">
                <p class="text-muted small text-uppercase fw-bold mb-2">Conv. Rate</p>
                <h3 class="fw-bold mb-2 text-dark">2.7%</h3>
                <div class="trend-up"><span class="material-symbols-outlined fs-6">trending_up</span> +0.4%</div>
            </div>
        </div>
    </div>

    <div class="row g-3 g-md-4">
        <div class="col-12 col-xl-8">
            <div class="chart-container">
                <h5 class="fw-bold mb-4 text-dark">Revenue Overview</h5>
                <div id="revenueChart" style="min-height: 320px;"></div>
            </div>
        </div>
        <div class="col-12 col-xl-4">
            <div class="chart-container">
                <h5 class="fw-bold mb-4 text-dark">Top Products</h5>
                <div id="productChart" style="min-height: 320px; display: flex; align-items: center; justify-content: center;"></div>
            </div>
        </div>
    </div>

    <script>
        var revOptions = {
            series: [{
                name: 'Revenue ($)',
                data: [400, 650, 500, 900, 1200, 1050, 1600, 1400, 1900]
            }],
            chart: { type: 'bar', height: '100%', minHeight: 320, toolbar: { show: false }, fontFamily: 'Inter, sans-serif' },
            colors: ['#6a11cb'],
            plotOptions: { bar: { borderRadius: 6, columnWidth: '45%' } },
            dataLabels: { enabled: false },
            xaxis: { 
                categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'],
                labels: { style: { colors: '#6c757d' } }
            },
            yaxis: {
                labels: { style: { colors: '#6c757d' } }
            },
            grid: { borderColor: '#f1f1f1', strokeDashArray: 4 },
            theme: { mode: 'light' }
        };

        var revChart = new ApexCharts(document.querySelector("#revenueChart"), revOptions);
        revChart.render();

        var prodOptions = {
            series: [44, 55, 13, 33],
            chart: { type: 'donut', height: '100%', minHeight: 320, fontFamily: 'Inter, sans-serif' },
            labels: ['Premium Tee', 'Coffee Mug', 'Classic Hoodie', 'Tote Bag'],
            colors: ['#6a11cb', '#2575fc', '#dfb162', '#198754'],
            plotOptions: {
                pie: { donut: { size: '70%', labels: { show: true, name: { show: true }, value: { show: true } } } }
            },
            theme: { mode: 'light' },
            legend: { position: 'bottom' }
        };

        var prodChart = new ApexCharts(document.querySelector("#productChart"), prodOptions);
        prodChart.render();
    </script>
</body>
</html>
