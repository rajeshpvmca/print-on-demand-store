<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnings & Payouts</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .stat-card { background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%); color: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(106, 17, 203, 0.3); padding: 2rem; }
        .history-card { background: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
    </style>
</head>
<body>
    <h2 class="page-title mb-4">Earnings & Payouts</h2>
    
    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="stat-card">
                <p class="small text-uppercase fw-bold mb-1 opacity-75">Available Balance</p>
                <h2 class="fw-bold display-5 mb-4">$1,450.75</h2>
                <button class="btn btn-light rounded-pill px-4 fw-bold text-dark">Withdraw Funds</button>
            </div>
        </div>
        <div class="col-md-6">
            <div class="stat-card" style="background: #fff; color: #1a1a1a; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
                <p class="small text-uppercase fw-bold mb-1 text-muted">Pending Clearance</p>
                <h3 class="fw-bold mb-4">$320.00</h3>
                <p class="small text-muted mb-0">Funds usually clear 3-5 days after order delivery.</p>
            </div>
        </div>
    </div>

    <div class="history-card p-4">
        <h5 class="fw-bold mb-4 text-dark">Payout History</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th class="text-muted small text-uppercase">Date</th>
                        <th class="text-muted small text-uppercase">Method</th>
                        <th class="text-muted small text-uppercase">Amount</th>
                        <th class="text-muted small text-uppercase">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Oct 01, 2026</td>
                        <td>Bank Transfer (**** 1234)</td>
                        <td class="fw-bold text-success">+$2,100.00</td>
                        <td><span class="badge bg-success rounded-pill">Completed</span></td>
                    </tr>
                    <tr>
                        <td>Sep 01, 2026</td>
                        <td>PayPal (studio@stackly.com)</td>
                        <td class="fw-bold text-success">+$1,850.50</td>
                        <td><span class="badge bg-success rounded-pill">Completed</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
