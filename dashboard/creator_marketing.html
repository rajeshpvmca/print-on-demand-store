<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Campaigns</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .campaign-card { background: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .promo-code { font-family: monospace; background: rgba(106, 17, 203, 0.1); color: var(--primary-color); padding: 5px 10px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="page-title mb-0">Marketing Campaigns</h2>
        <button class="btn btn-primary-stackly rounded-pill px-4"><span class="material-symbols-outlined fs-6 align-middle">add</span> New Campaign</button>
    </div>

    <div class="campaign-card p-4">
        <h5 class="fw-bold mb-4 text-dark">Active Promo Codes</h5>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th class="text-muted small text-uppercase">Code</th>
                        <th class="text-muted small text-uppercase">Discount</th>
                        <th class="text-muted small text-uppercase">Uses</th>
                        <th class="text-muted small text-uppercase">Status</th>
                        <th class="text-muted small text-uppercase text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><span class="promo-code">HOLIDAY20</span></td>
                        <td>20% Off</td>
                        <td>45 / 100</td>
                        <td><span class="badge bg-success rounded-pill">Active</span></td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-secondary rounded-pill me-2">Share</button>
                            <button class="btn btn-sm btn-outline-danger rounded-pill">End</button>
                        </td>
                    </tr>
                    <tr>
                        <td><span class="promo-code">WELCOME10</span></td>
                        <td>10% Off</td>
                        <td>112 / &infin;</td>
                        <td><span class="badge bg-success rounded-pill">Active</span></td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-secondary rounded-pill me-2">Share</button>
                            <button class="btn btn-sm btn-outline-danger rounded-pill">End</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
