<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { background-color: #f8f9fa; padding: 2rem; font-family: 'Inter', sans-serif; }
        .page-title { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--primary-color); }
        .order-card { background: #fff; border-radius: 16px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .status-badge { padding: 6px 12px; border-radius: 50px; font-weight: 600; font-size: 0.8rem; }
        .status-processing { background: rgba(106, 17, 203, 0.1); color: var(--primary-color); }
        .status-shipped { background: rgba(25, 135, 84, 0.1); color: #198754; }
        .status-delivered { background: rgba(13, 110, 253, 0.1); color: #0d6efd; }
    </style>
</head>
<body>
    <h2 class="page-title mb-4">My Orders</h2>
    <div class="order-card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th class="text-muted small text-uppercase">Order ID</th>
                        <th class="text-muted small text-uppercase">Date</th>
                        <th class="text-muted small text-uppercase">Items</th>
                        <th class="text-muted small text-uppercase">Total</th>
                        <th class="text-muted small text-uppercase">Status</th>
                        <th class="text-muted small text-uppercase text-end">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="fw-bold">#ORD-9021</td>
                        <td>Oct 24, 2026</td>
                        <td>2x Premium Tee</td>
                        <td class="fw-bold">$49.98</td>
                        <td><span class="status-badge status-processing">Processing</span></td>
                        <td class="text-end"><button class="btn btn-sm btn-outline-secondary rounded-pill">Track</button></td>
                    </tr>
                    <tr>
                        <td class="fw-bold">#ORD-8942</td>
                        <td>Oct 15, 2026</td>
                        <td>1x Ceramic Mug</td>
                        <td class="fw-bold">$14.99</td>
                        <td><span class="status-badge status-shipped">Shipped</span></td>
                        <td class="text-end"><button class="btn btn-sm btn-outline-secondary rounded-pill">Track</button></td>
                    </tr>
                    <tr>
                        <td class="fw-bold">#ORD-8109</td>
                        <td>Sep 02, 2026</td>
                        <td>1x Custom Canvas</td>
                        <td class="fw-bold">$89.00</td>
                        <td><span class="status-badge status-delivered">Delivered</span></td>
                        <td class="text-end"><button class="btn btn-sm btn-outline-secondary rounded-pill">Invoice</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
