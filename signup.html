<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Stackly Custom Print-on-Demand Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            background-color: #f8f9fa;
        }

        .auth-card {
            background: #ffffff;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1) !important;
            border-radius: 20px;
        }

        .unique-role-selector {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .unique-role-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 5px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .unique-role-item span.material-symbols-outlined {
            font-size: 1.5rem;
            color: #6c757d;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .unique-role-item .role-text {
            font-weight: 700;
            color: #6c757d;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-check:checked + .unique-role-item {
            background: rgba(106, 17, 203, 0.05);
            border-color: var(--primary-color);
            box-shadow: 0 4px 15px rgba(106, 17, 203, 0.1);
        }

        .btn-check:checked + .unique-role-item span.material-symbols-outlined,
        .btn-check:checked + .unique-role-item .role-text {
            color: var(--primary-color);
        }

        .unique-role-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }

        .toggle-password {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            color: #adb5bd;
            border-left: none;
            transition: all 0.3s ease;
        }
        .input-group:focus-within .toggle-password {
            border-color: var(--primary-color);
            background: #fff;
        }
        .toggle-password:hover {
            color: var(--primary-color);
        }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .auth-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .auth-link:hover {
            color: var(--secondary-color);
        }
    </style>
</head>

<body>
    <!-- Animated Background Image -->
    <div class="position-fixed top-0 start-0 w-100 h-100 bg-image-zoom" style="background: url('https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=1600&h=900&fit=crop') no-repeat center center; background-size: cover; z-index: -2;"></div>
    <!-- Premium Gradient Overlay -->
    <div class="position-fixed top-0 start-0 w-100 h-100" style="background: linear-gradient(135deg, rgba(18, 18, 18, 0.85) 0%, rgba(106, 17, 203, 0.8) 100%); backdrop-filter: blur(5px); z-index: -1;"></div>

    <div class="container position-relative z-1 py-3">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-7 col-xl-6">
                <div class="auth-card p-4 p-lg-5" data-aos="zoom-in">
                    
                    <div class="text-center mb-5">
                        <a href="index.html" class="small auth-link mb-3 d-inline-block"><i class="fas fa-arrow-left me-2"></i> Return to Home</a>
                        <h2 class="display-6 fw-bold mb-2 text-dark">Create an Account</h2>
                        <p class="text-muted">Join Stackly and start building your custom products.</p>
                    </div>

                    <form id="signupForm" action="login.html">
                        
                        <label class="form-label text-dark small fw-bold tracking-wide text-uppercase mb-3 d-block text-center">I am a...</label>
                        <div class="unique-role-selector mb-4">
                            <!-- Role 1: Shopper -->
                            <input type="radio" class="btn-check" name="role" id="roleShopper" value="Shopper" checked autocomplete="off">
                            <label class="unique-role-item" for="roleShopper">
                                <span class="material-symbols-outlined fs-3 mb-1">shopping_bag</span>
                                <span class="role-text">Shopper</span>
                            </label>

                            <!-- Role 2: Creator -->
                            <input type="radio" class="btn-check" name="role" id="roleCreator" value="Creator" autocomplete="off">
                            <label class="unique-role-item" for="roleCreator">
                                <span class="material-symbols-outlined fs-3 mb-1">brush</span>
                                <span class="role-text">Creator</span>
                            </label>

                            <!-- Role 3: Supplier -->
                            <input type="radio" class="btn-check" name="role" id="roleSupplier" value="Supplier" autocomplete="off">
                            <label class="unique-role-item" for="roleSupplier">
                                <span class="material-symbols-outlined fs-3 mb-1">local_shipping</span>
                                <span class="role-text">Supplier</span>
                            </label>
                        </div>

                        <div class="row g-3 mb-4 text-start">
                            <div class="col-md-6">
                                <label class="form-label text-dark small fw-bold tracking-wide text-uppercase">Full Name</label>
                                <input class="form-control premium-input shadow-none" type="text" id="name" placeholder="John Doe" pattern="[A-Za-z\s]+" oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark small fw-bold tracking-wide text-uppercase">Email Address</label>
                                <input class="form-control premium-input shadow-none" type="email" id="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-2 text-start">
                            <div class="col-md-6">
                                <label class="form-label text-dark small fw-bold tracking-wide text-uppercase">Secure Password</label>
                                <div class="input-group">
                                    <input class="form-control premium-input border-end-0 shadow-none" type="password" id="password" placeholder="Enter password" minlength="8" required style="border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important;">
                                    <button class="btn toggle-password" type="button" style="border-top-right-radius: 10px; border-bottom-right-radius: 10px;">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-dark small fw-bold tracking-wide text-uppercase">Confirm Password</label>
                                <div class="input-group">
                                    <input class="form-control premium-input border-end-0 shadow-none" type="password" id="confirmPassword" placeholder="Confirm password" required style="border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important;">
                                    <button class="btn toggle-password" type="button" style="border-top-right-radius: 10px; border-bottom-right-radius: 10px;">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Strength bar -->
                        <div class="mb-2" style="height:4px;border-radius:4px;background:#e9ecef;overflow:hidden;">
                            <div id="strengthBar" style="height:100%;width:0;transition:width 0.3s, background 0.3s;"></div>
                        </div>
                        <div id="matchMsg" class="mb-4 text-danger small"></div>

                        <div class="form-check mb-5 text-start">
                            <input class="form-check-input shadow-none" type="checkbox" id="terms" required>
                            <label class="form-check-label small text-muted" for="terms">
                                I accept the <a href="#" class="auth-link">Terms & Conditions</a>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary-stackly w-100 py-3 fw-bold mb-4 d-flex align-items-center justify-content-center gap-2">
                            Create Account <i class="bi bi-person-plus-fill ms-1"></i>
                        </button>

                        <p class="text-center mb-0 small text-muted">Already have an account? <a href="login.html" class="fw-bold auth-link">Login Here</a></p>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            AOS.init({
                duration: 1000,
                once: true
            });
        });

        // Live password strength
        const pwdInput = document.getElementById('password');
        const confirmPwd = document.getElementById('confirmPassword');
        const bar = document.getElementById('strengthBar');
        const matchMsg = document.getElementById('matchMsg');
        
        const rules = {
            'r-len': v => v.length >= 8,
            'r-upper': v => /[A-Z]/.test(v),
            'r-num': v => /[0-9]/.test(v),
            'r-sym': v => /[^A-Za-z0-9]/.test(v)
        };
        const colors = ['#dc3545', '#fd7e14', '#ffc107', '#198754'];
        
        pwdInput.addEventListener('input', () => {
            const v = pwdInput.value;
            let passed = 0;
            Object.values(rules).forEach(fn => {
                if (fn(v)) passed++;
            });
            bar.style.width = (passed / 4 * 100) + '%';
            bar.style.background = colors[passed - 1] || '#e9ecef';
            checkMatch();
        });

        confirmPwd.addEventListener('input', checkMatch);

        function checkMatch() {
            if (confirmPwd.value.length > 0) {
                if (pwdInput.value === confirmPwd.value) {
                    matchMsg.style.color = '#198754';
                    matchMsg.innerHTML = '<i class="fas fa-check-circle me-1"></i>Passwords match';
                } else {
                    matchMsg.style.color = '#dc3545';
                    matchMsg.innerHTML = '<i class="fas fa-times-circle me-1"></i>Passwords do not match';
                }
            } else {
                matchMsg.innerHTML = '';
            }
        }
    </script>
</body>
</html>
